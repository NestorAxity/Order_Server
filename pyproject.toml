[project]
name = "order_server"
version = "0.1.0"
description = "Servicio de ordenes con autenticación de usuario y CRUD"
authors = [
    {name = "Nestor Hernandez",email = "nestor.hernandezc@axity.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi (>=0.110.0,<1.0.0)",
    "uvicorn (>=0.28.0,<1.0.0)",
    "pyjwt[crypto] (>=2.13.0,<3.0.0)",
    "sqlalchemy (>=2.0.28,<3.0.0)",
    "pydantic[email] (>=2.10.0,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "pwdlib[bcrypt] (>=0.3.1,<0.4.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "typer (>=0.27.2,<0.28.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "alembic (>=1.20.0,<2.0.0)"
]

[tool.poetry]
packages = [{include = "order_server", from = "src"}]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
order-cli = "order_app.cli.main:app"

# --- RUFF (Linter y Formateador) ---
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]  # PEP 8 (E), Pyflakes/Bugs (F), isort (I)
ignore = ["E501"]

# --- MYPY (Chequeo estático de tipos) ---
[tool.mypy]
python_version = "3.13"
strict = true
exclude = ["^tests/"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["sqlalchemy.ext.mypy.plugin", "pydantic.mypy"]
follow_imports = "normal"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fastapi.*"
ignore_missing_imports = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false
[[tool.mypy.overrides]]
module = "requests.*"
ignore_missing_imports = true

# --- DEPENDENCIAS DE DESARROLLO ---
[dependency-groups]
dev = [
    "ruff (>=0.3.0)",
    "mypy (>=1.10.0)",
    "pre-commit (>=3.6.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pip-audit (>=2.10.1,<3.0.0)"
]

# ---  UNIT TEST CONFIG ---
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--cov=order_server --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src/order_server"]
omit = [
    "src/order_server/config/*",
    "src/order_server/main.py",
    "src/order_server/infrastructure/models/*",
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
fail_under = 80  # Opcional: hace que pytest falle si la cobertura es menor al 80%
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
