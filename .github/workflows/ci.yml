name: CI/CD Pipeline

on:
  push:
    branches: [ dev, stage, main ]
  pull_request:
    branches: [ dev, stage, main ]

jobs:
  quality-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: |
          pip install poetry==2.4.3

      # 1. Configurar caché de dependencias de Poetry
      - name: Setup Poetry cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "poetry"

      - name: Install dependencies
        run: |
          poetry install

      - name: Audit Dependencies for CVEs
        run: |
          poetry run pip-audit

      - name: Run Ruff (Linter)
        run: |
          poetry run ruff check .

      - name: Run Mypy (Type Checker)
        run: |
          poetry run mypy src

      - name: Run Pytest
        run: |
          poetry run pytest

  docker-build:
    needs: quality-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 2. Configurar motor Buildx de Docker para mejorar la caché de capas
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Environment Tag
        id: env-tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TAG=latest" >> $GITHUB_ENV
          else
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      # 3. Construye la imagen siempre (incluso en PRs para validar el Dockerfile),
      # usando la caché de GitHub Actions para acelerar la construcción.
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false  # Cambiar a true cuando configures un registry como Docker Hub o GHCR
          tags: order-app:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max