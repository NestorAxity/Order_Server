name: CI/CD Pipeline

on:
  push:
    branches: [ dev, stage, main ]
  pull_request:
    branches: [ dev, stage, main ]

jobs:
  quality-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: |
          pip install poetry==2.4.3

      - name: Install dependencies
        run: |
          poetry install

      - name: Audit Dependencies for CVEs
        run: |
          poetry run pip-audit

      - name: Run Ruff (Linter)
        run: |
          poetry run ruff check .

      - name: Run Mypy (Type Checker)
        run: |
          poetry run mypy src

      - name: Run Pytest
        run: |
          poetry run pytest

      #- name: Build Package (Wheel)
      #  run: |
      #    poetry build

  docker-build:
    needs: quality-and-test
    # Solo construye la imagen Docker cuando el código ya fue fusionado/empujado a una rama principal, no en PRs abiertos
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Environment Tag
        id: env-tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TAG=latest" >> $GITHUB_ENV
          else
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Build Docker Image
        run: |
          docker build -t order-app:${{ env.TAG }} .