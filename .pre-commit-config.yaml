repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix, --select, "E,F,I"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies:
          - "fastapi>=0.110.0"
          - "uvicorn>=0.28.0"
          - "sqlalchemy>=2.0.0"
          - "pydantic>=2.10.0"
          - "pydantic-settings>=2.15.0"
          - "httpx>=0.28.0"